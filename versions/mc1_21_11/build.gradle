plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

def targetJavaVersion = providers.gradleProperty('java_version_1_21_11').get().toInteger()

group = project.mod_group
version = project.mod_version

base {
    archivesName = 'ascend-client-mc1.21.11'
}

loom {
    splitEnvironmentSourceSets()
}

sourceSets {
    shared {
        java.srcDir(rootProject.file('shared/src/main/java'))
        resources.srcDir(rootProject.file('shared/src/main/resources'))
    }

    main {
        compileClasspath += sourceSets.shared.output
        runtimeClasspath += sourceSets.shared.output
    }

    client {
        compileClasspath += sourceSets.main.output + sourceSets.shared.output
        runtimeClasspath += sourceSets.main.output + sourceSets.shared.output
    }

    test {
        compileClasspath += sourceSets.shared.output
        runtimeClasspath += sourceSets.shared.output
    }
}

loom {
    mods {
        ascendclient {
            sourceSet sourceSets.shared
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            task {
                javaLauncher.set(javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(targetJavaVersion)
                })
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version_1_21_11}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version_1_21_11}"
    modImplementation "maven.modrinth:rinku:${rinku_version_1_21_11}"
    sharedCompileOnly "com.google.code.gson:gson:${gson_version}"
    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    options.release = targetJavaVersion
}

tasks.named('compileSharedJava', JavaCompile).configure {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar') {
    from sourceSets.shared.output
}

tasks.register('verifyClientLauncher') {
    group = 'verification'
    description = "Verifies runClient uses Java ${targetJavaVersion}."
    doLast {
        def launcher = tasks.named('runClient').get().javaLauncher.get()
        def actualVersion = launcher.metadata.languageVersion.asInt()

        if (actualVersion != targetJavaVersion) {
            throw new GradleException("runClient must use Java ${targetJavaVersion}, but uses Java ${actualVersion}.")
        }

        logger.lifecycle("runClient Java ${actualVersion}: ${launcher.metadata.installationPath}")
    }
}

def resourceVersion = project.version

processResources {
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') {
        expand 'version': resourceVersion
    }
}
